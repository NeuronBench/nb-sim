[package]
edition = "2021"
name = "nb-sim"
version = "0.1.0"
resolver = "2"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]


[[bin]]
name = "bevy"
path = "src/bin/bevy.rs"

[dependencies]
once_cell = "^1.18"
wasm-bindgen = "0.2.86"
csv = "^1.1.6"
bevy = "0.18"
bevy_egui = "0.39"
crossbeam = { version = "^0.8", features = ["crossbeam-channel"] }
ehttp = "^0.5"
querystring = "^1.1"
serde = { version = "1.0.158", features=["serde_derive"]}
serde_json = "1.0.94"
web-sys = { version = "^0.3", features=["Location", "Window", "Document", "Element", "HtmlTextAreaElement"] }
bytemuck = { version = "1", features = ["derive"] }
bevy_panorbit_camera = { version = "0.34", features = ["bevy_egui"] }
egui_plot = "0.34"
neuroml = { git = "https://github.com/neuronbench/neuroml-rs", version = "0.1" }
uom = { git = "https://github.com/neuronbench/uom", version = "0.36.0" }


[build-dependencies]
vergen = { version = "^8.1", features = [ "build", "git", "gitcl" ] }
